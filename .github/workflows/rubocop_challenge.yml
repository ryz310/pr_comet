name: RuboCop Challenge

on:
  schedule:
    - cron: '30 23 * * *' # 08:30 JST
  workflow_dispatch:

concurrency:
  group: rubocop-challenge
  cancel-in-progress: false

permissions: {}

jobs:
  challenge:
    if: ${{ vars.GHA_CHALLENGE_ENABLED == 'true' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1.343.0
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - name: Install locked dependencies
        env:
          BUNDLE_FROZEN: 'true'
        run: bundle install
      - name: Install Challenger
        run: gem install rubocop_challenger -v 2.11.1 --no-document

      # Published PrComet 0.7.x expects the HTTPS remote to end in .git.
      - name: Normalize origin for PrComet
        run: git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Mint repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.CHALLENGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHALLENGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open challenge pull request
        env:
          GITHUB_ACCESS_TOKEN: ${{ steps.app-token.outputs.token }}
        run: rubocop_challenger go --email=ryz310@gmail.com --name=ryz310
