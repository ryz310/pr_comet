# Ruby CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-ruby/ for more details
#
version: 2.1

references:
  - &ruby_version
    ruby_version:
      type: enum
      enum: ['3.3', '3.4', '4.0']
      default: '3.3'

executors:
  default:
    parameters:
      <<: *ruby_version
    docker:
      - image: cimg/ruby:<< parameters.ruby_version >>
    working_directory: ~/repo

commands:
  run_rspec:
    description: Run RSpec
    steps:
      - run:
          name: Execute RSpec
          command: |
            mkdir /tmp/test-results
            TEST_FILES="$(circleci tests glob "spec/**/*_spec.rb" | circleci tests split --split-by=timings)"
            bundle exec rspec --format documentation \
                              --color \
                              --format RspecJunitFormatter \
                              --out /tmp/test-results/rspec.xml \
                              $TEST_FILES
      - run:
          name: Prepare SimpleCov report
          command: |
            mkdir -p coverage/reports
            cp coverage/.resultset.json "coverage/reports/resultset.${CIRCLE_BUILD_NUM}.json"
      - persist_to_workspace:
          root: coverage
          paths:
            - reports/*.json
      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results
          destination: test-results
  rubocop:
    steps:
      - run:
          name: Run RuboCop
          command: bundle exec rubocop
  yardoc:
    description: "Generate YARDoc"
    steps:
      - run: bundle exec yardoc -o ./yardoc
      - store_artifacts:
          path: ./yardoc
          destination: yardoc
  rake_build:
    steps:
      - run:
          name: Rake Build
          command: bundle exec rake build
  rubocop_challenge:
    steps:
      - run:
          name: Rubocop Challenge
          command: |
            gem install rubocop_challenger
            rubocop_challenger go --email=ryz310@gmail.com --name=ryz310
  release:
    description: Release to RubyGems.org
    steps:
      - run:
          name: Create Rubygems Credentials
          command: |
            mkdir ~/.gem || true
            echo -e "---\n:rubygems_api_key: ${RUBYGEMS_API_KEY}" > ~/.gem/credentials
            chmod 0600 ~/.gem/credentials
      - run:
          name: Release Gem
          command: |
            git push --set-upstream origin ${CIRCLE_BRANCH}
            bundle exec rake release --trace
  setup:
    description: Setup for Job Working
    steps:
      - checkout
      - run:
          name: Install locked dependencies
          command: |
            BUNDLE_FROZEN=true bundle install
  test_and_build:
    description: Build the RubyGem
    steps:
      - run_rspec
      - rake_build

jobs:
  build:
    parameters:
      <<: *ruby_version
    executor:
      name: default
      ruby_version: << parameters.ruby_version >>
    steps:
      - setup
      - test_and_build
  collect-coverage:
    executor: default
    steps:
      - attach_workspace:
          at: ~/repo
      - run:
          name: Verify all Ruby coverage reports
          command: |
            set -- reports/resultset.*.json
            # Keep this in sync with the number of Ruby build jobs below.
            test "$#" -eq 3 && test -f "$1"
      - store_artifacts:
          path: reports
          destination: simplecov
  rubocop:
    executor: default
    steps:
      - setup
      - rubocop
  yardoc:
    executor: default
    steps:
      - setup
      - yardoc
  rubocop_challenge:
    executor: default
    steps:
      - checkout
      - rubocop_challenge
  release:
    executor: default
    steps:
      - setup
      - release

workflows:
  version: 2

  commit:
    jobs:
      - build:
          name: build_on_ruby_3.3
          ruby_version: '3.3'
      - build:
          name: build_on_ruby_3.4
          ruby_version: '3.4'
      - build:
          name: build_on_ruby_4.0
          ruby_version: '4.0'
      - rubocop
      - yardoc
      - collect-coverage:
          requires:
            - build_on_ruby_3.3
            - build_on_ruby_3.4
            - build_on_ruby_4.0
      - release:
          context: RubyGems API Key
          requires:
            - build_on_ruby_3.3
            - build_on_ruby_3.4
            - build_on_ruby_4.0
            - rubocop
          filters:
            branches:
              only:
                - production

  challenge:
    triggers:
      - schedule:
          cron: "30 23 * * *" # 8:30am every day (JST)
          filters:
            branches:
              only:
                - master
    jobs:
      - rubocop_challenge
